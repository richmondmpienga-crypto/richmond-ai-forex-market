<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Richmond AI Forex Market</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #020817;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(2, 8, 23, 0.60), rgba(2, 8, 23, 0.82)),
        url("./richmond-ai-logo.png") center / 720px auto no-repeat;
      opacity: 0.85;
      z-index: 0;
      pointer-events: none;
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: min(420px, calc(100% - 32px));
      padding: 36px;
      border-radius: 20px;
      background: rgba(7, 20, 42, 0.90);
      border: 1px solid #183a60;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
    }

    .login-logo {
      width: 100px;
      height: 100px;
      display: block;
      margin: 0 auto 18px;
      object-fit: contain;
      border-radius: 18px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 7px;
    }

    .subtitle {
      text-align: center;
      color: #38bdf8;
      font-size: 13px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 10px;
      border: 1px solid #25476c;
      background: #07172d;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #22a7f0;
      box-shadow: 0 0 0 3px rgba(34, 167, 240, 0.12);
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.08);
    }

    .secure {
      margin-top: 18px;
      text-align: center;
      color: #64748b;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      body::before {
        background-size: 430px auto;
      }

      .login-card {
        padding: 28px 22px;
      }
    }
  </style>
</head>

<body>

  <div class="login-card">
    <img
      src="./richmond-ai-logo.png"
      alt="Richmond AI Forex Market"
      class="login-logo"
    >

    <h1>Richmond AI Forex Market</h1>
    <div class="subtitle">AI-Powered Forex Market Scanner</div>

    <form id="loginForm">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Login to Scanner</button>
    </form>

    <div class="secure">Secure access • Richmond AI Forex Market</div>
  </div>

</body>
</html>
